<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 276" role="img" aria-label="20 o más años en producción del CTO. 4 nubes. 0 cambios en producción sin tu autorización. 100 por cien en tus cuentas y repositorios."><style>text{font-family:'Poppins','Segoe UI',Helvetica,Arial,sans-serif;}.pan{fill:#10121A;} .n{font-size:40px;font-weight:800;} .l{fill:#9AA3AE;font-size:13px;}</style><defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#22E9F2"/><stop offset="1" stop-color="#4E29D6"/></linearGradient>
    <linearGradient id="g2" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#22E9F2"/><stop offset="1" stop-color="#4E29D6"/></linearGradient>
