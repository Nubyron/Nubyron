<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 672" role="img" aria-label="Servicios de Nubyron: revisión de infraestructura Cloud, arquitectura Cloud, optimización de costes, seguridad Cloud, consultoría y asesoramiento, migración a la nube, soporte y gestión Cloud, Kubernetes contenedores y DevOps, y asesoría técnica sin permanencia.">
  <style>
    text { font-family: 'Poppins','Segoe UI',Helvetica,Arial,sans-serif; }
    .card { fill: #10121A; }
    .ti { fill: #F2F5F7; font-size: 16px; font-weight: 700; }
    .de { fill: #B4BBC6; font-size: 13px; }
    .big { font-size: 32px; font-weight: 800; }
    .tag { fill: #07080C; font-size: 9px; font-weight: 800; letter-spacing: 1.6px; }
    .ic { fill: none; stroke: #22E9F2; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }
  </style>
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#22E9F2"/><stop offset="1" stop-color="#4E29D6"/></linearGradient>
    <linearGradient id="g2" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#22E9F2"/><stop offset="1" stop-color="#4E29D6"/></linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="3.2" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <filter id="glow2" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="7" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>

    <linearGradient id="bd" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="940" y2="0" spreadMethod="reflect"><stop offset="0" stop-color="#22E9F2"/><stop offset="0.5" stop-color="#4E29D6"/><stop offset="1" stop-color="#22E9F2"/><animateTransform attributeName="gradientTransform" type="translate" from="-940 0" to="940 0" dur="9s" repeatCount="indefinite"/></linearGradient>
    <linearGradient id="sh" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#22E9F2" stop-opacity="0"/><stop offset="0.5" stop-color="#22E9F2" stop-opacity="0.16"/><stop offset="1" stop-color="#22E9F2" stop-opacity="0"/></linearGradient>
    <clipPath id="cp"><rect x="0" y="0" width="219" height="226" rx="16"/><rect x="240" y="0" width="219" height="226" rx="16"/><rect x="480" y="0" width="219" height="226" rx="16"/><rect x="720" y="0" width="219" height="226" rx="16"/><rect x="0" y="246" width="219" height="226" rx="16"/><rect x="240" y="246" width="219" height="226" rx="16"/><rect x="480" y="246" width="219" height="226" rx="16"/><rect x="720" y="246" width="219" height="226" rx="16"/></clipPath>
  </defs>
  <g transform="translate(0 0)">
<rect class="card" x="1" y="1" width="217" height="224" rx="16"/>
<rect x="1" y="1" width="217" height="224" rx="16" fill="none" stroke="url(#bd)" stroke-width="2.4" opacity="1"/>
<rect x="69" y="16" width="132" height="22" rx="11" fill="url(#g)"><animate attributeName="opacity" values="1;0.65;1" dur="2.4s" repeatCount="indefinite"/></rect>
<text class="tag" x="135" y="31" text-anchor="middle">POR DÓNDE EMPEZAR</text>
<g class="ic" transform="translate(22 24) scale(0.95)" filter="url(#glow)"><circle cx="12" cy="12" r="8"/><path d="M18 18l8 8"/></g>
<text class="ti" x="20" y="90">Revisión de tu</text>
<text class="ti" x="20" y="110">infraestructura</text>
<text class="ti" x="20" y="130">Cloud</text>
<text class="de" x="20" y="156">Descubre riesgos, gasto</text>
<text class="de" x="20" y="173">innecesario y mejoras</text>
<text class="de" x="20" y="190">antes de que te cuesten</text>
<text class="de" x="20" y="207">dinero.</text>
</g>
<g transform="translate(240 0)">
<rect class="card" x="1" y="1" width="217" height="224" rx="16"/>
<rect x="1" y="1" width="217" height="224" rx="16" fill="none" stroke="url(#bd)" stroke-width="1.6" opacity="0.75"/>
<g class="ic" transform="translate(22 24) scale(0.95)" filter="url(#glow)"><rect x="2" y="3" width="26" height="7" rx="2"/><rect x="2" y="13" width="26" height="7" rx="2"/><rect x="2" y="23" width="26" height="7" rx="2"/></g>
<text class="ti" x="20" y="90">Arquitectura Cloud</text>
<text class="de" x="20" y="116">Infraestructura segura y</text>
<text class="de" x="20" y="133">estable, para crecer con</text>
<text class="de" x="20" y="150">tu producto sin rehacerla</text>
<text class="de" x="20" y="167">cada año.</text>
</g>
<g transform="translate(480 0)">
<rect class="card" x="1" y="1" width="217" height="224" rx="16"/>
<rect x="1" y="1" width="217" height="224" rx="16" fill="none" stroke="url(#bd)" stroke-width="2.4" opacity="1"/>
<rect x="69" y="16" width="132" height="22" rx="11" fill="url(#g)"><animate attributeName="opacity" values="1;0.65;1" dur="2.4s" repeatCount="indefinite"/></rect>
<text class="tag" x="135" y="31" text-anchor="middle">POR DÓNDE EMPEZAR</text>
<g class="ic" transform="translate(22 24) scale(0.95)" filter="url(#glow)"><rect x="3" y="16" width="6" height="14"/><rect x="12" y="8" width="6" height="22"/><rect x="21" y="2" width="6" height="28"/></g>
<text class="ti" x="20" y="90">Optimización de</text>
<text class="ti" x="20" y="110">costes Cloud</text>
<text class="de" x="20" y="136">Entiende en qué gastas y</text>
<text class="de" x="20" y="153">reduce lo innecesario</text>
<text class="de" x="20" y="170">priorizando por riesgo.</text>
</g>
<g transform="translate(720 0)">
<rect class="card" x="1" y="1" width="217" height="224" rx="16"/>
<rect x="1" y="1" width="217" height="224" rx="16" fill="none" stroke="url(#bd)" stroke-width="1.6" opacity="0.75"/>
<g class="ic" transform="translate(22 24) scale(0.95)" filter="url(#glow)"><path d="M15 2l12 5v9c0 8-5 12-12 15C8 28 3 24 3 16V7z"/><path d="M9 16l4 4 8-9"/></g>
<text class="ti" x="20" y="90">Seguridad Cloud</text>
<text class="de" x="20" y="116">Accesos, datos y</text>
<text class="de" x="20" y="133">configuraciones mejor</text>
<text class="de" x="20" y="150">protegidos, con</text>
<text class="de" x="20" y="167">prioridades claras.</text>
</g>
<g transform="translate(0 246)">
<rect class="card" x="1" y="1" width="217" height="224" rx="16"/>
<rect x="1" y="1" width="217" height="224" rx="16" fill="none" stroke="url(#bd)" stroke-width="1.6" opacity="0.75"/>
<g class="ic" transform="translate(22 24) scale(0.95)" filter="url(#glow)"><rect x="2" y="3" width="27" height="19" rx="4"/><path d="M9 22v8l8-8"/></g>
<text class="ti" x="20" y="90">Consultoría y</text>
<text class="ti" x="20" y="110">asesoramiento Cloud</text>
<text class="de" x="20" y="136">Decisiones Cloud con</text>
<text class="de" x="20" y="153">criterio: qué necesitas,</text>
<text class="de" x="20" y="170">qué no y cómo sacarle</text>
<text class="de" x="20" y="187">partido.</text>
</g>
<g transform="translate(240 246)">
<rect class="card" x="1" y="1" width="217" height="224" rx="16"/>
<rect x="1" y="1" width="217" height="224" rx="16" fill="none" stroke="url(#bd)" stroke-width="1.6" opacity="0.75"/>
<g class="ic" transform="translate(22 24) scale(0.95)" filter="url(#glow)"><rect x="1" y="9" width="10" height="14" rx="2"/><rect x="21" y="9" width="10" height="14" rx="2"/><path d="M13 16h6M16 12l4 4-4 4"/></g>
<text class="ti" x="20" y="90">Migración a la nube</text>
<text class="de" x="20" y="116">Mueve aplicaciones a la</text>
<text class="de" x="20" y="133">nube o entre proveedores</text>
<text class="de" x="20" y="150">con un plan y los riesgos</text>
<text class="de" x="20" y="167">gestionados.</text>
</g>
<g transform="translate(480 246)">
<rect class="card" x="1" y="1" width="217" height="224" rx="16"/>
<rect x="1" y="1" width="217" height="224" rx="16" fill="none" stroke="url(#bd)" stroke-width="1.6" opacity="0.75"/>
<g class="ic" transform="translate(22 24) scale(0.95)" filter="url(#glow)"><circle cx="16" cy="16" r="13"/><circle cx="16" cy="16" r="5"/><path d="M7 7l5 5M25 7l-5 5M7 25l5-5M25 25l-5-5"/></g>
<text class="ti" x="20" y="90">Soporte y gestión</text>
<text class="ti" x="20" y="110">Cloud</text>
<text class="de" x="20" y="136">Resolvemos incidencias y</text>
<text class="de" x="20" y="153">mantenemos tu Cloud en el</text>
<text class="de" x="20" y="170">horario acordado.</text>
</g>
<g transform="translate(720 246)">
<rect class="card" x="1" y="1" width="217" height="224" rx="16"/>
<rect x="1" y="1" width="217" height="224" rx="16" fill="none" stroke="url(#bd)" stroke-width="2.4" opacity="1"/>
<rect x="69" y="16" width="132" height="22" rx="11" fill="url(#g)"><animate attributeName="opacity" values="1;0.65;1" dur="2.4s" repeatCount="indefinite"/></rect>
<text class="tag" x="135" y="31" text-anchor="middle">POR DÓNDE EMPEZAR</text>
<g class="ic" transform="translate(22 24) scale(0.95)" filter="url(#glow)"><rect x="2" y="2" width="12" height="12" rx="2"/><rect x="18" y="2" width="12" height="12" rx="2"/><rect x="2" y="18" width="12" height="12" rx="2"/><rect x="18" y="18" width="12" height="12" rx="2"/></g>
<text class="ti" x="20" y="90">Kubernetes,</text>
<text class="ti" x="20" y="110">contenedores y</text>
<text class="ti" x="20" y="130">DevOps</text>
<text class="de" x="20" y="156">Despliegues automáticos y</text>
<text class="de" x="20" y="173">plataformas de</text>
<text class="de" x="20" y="190">contenedores más fiables</text>
<text class="de" x="20" y="207">para tu equipo.</text>
</g>
  <g clip-path="url(#cp)"><rect x="-200" y="0" width="200" height="492" fill="url(#sh)" transform="skewX(-14)"><animate attributeName="x" values="-260;1000" dur="6s" repeatCount="indefinite"/></rect></g>
  <g transform="translate(0 496)">
  <rect class="card" x="1" y="1" width="938" height="166" rx="20"/>
  <rect x="1" y="1" width="938" height="166" rx="20" fill="none" stroke="url(#bd)" stroke-width="2.4"/>
  <text class="de" x="40" y="46">O, si solo necesitas una segunda opinión senior:</text>
  <text class="big" x="40" y="88" fill="url(#g)" filter="url(#glow)">Asesoría técnica</text>
  <text class="de" x="40" y="116">Desde una sola sesión hasta un acompañamiento continuo, con la frecuencia que</text>
  <text class="de" x="40" y="136">necesite tu proyecto. Sin permanencia.</text>
  <g transform="translate(690 60)" filter="url(#glow)"><rect width="210" height="48" rx="24" fill="url(#g)"><animate attributeName="opacity" values="1;0.8;1" dur="2.6s" repeatCount="indefinite"/></rect>
  <text x="105" y="30" text-anchor="middle" font-size="15" font-weight="800" fill="#07080C">Reserva 30 minutos →</text></g>
</g>
</svg>
