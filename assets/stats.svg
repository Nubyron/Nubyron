<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 150" role="img" aria-label="20 o más años en producción del CTO. 4 nubes: AWS, Azure, Google Cloud y OCI. 0 cambios en producción sin tu autorización. 100 por cien en tus cuentas y repositorios.">
  <style>
    text { font-family: 'Poppins','Segoe UI',Helvetica,Arial,sans-serif; }
    .pan { fill: #10121A; }
    .n { font-size: 46px; font-weight: 800; }
    .l { fill: #9AA3AE; font-size: 13px; }
  </style>
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#22E9F2"/><stop offset="1" stop-color="#4E29D6"/></linearGradient>
    <linearGradient id="g2" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#22E9F2"/><stop offset="1" stop-color="#4E29D6"/></linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="3.2" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <filter id="glow2" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="7" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>

    <linearGradient id="bd" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="940" y2="0" spreadMethod="reflect"><stop offset="0" stop-color="#22E9F2"/><stop offset="0.5" stop-color="#4E29D6"/><stop offset="1" stop-color="#22E9F2"/><animateTransform attributeName="gradientTransform" type="translate" from="-940 0" to="940 0" dur="9s" repeatCount="indefinite"/></linearGradient>
  </defs>
  <g transform="translate(0 0)">
  <rect class="pan" x="1" y="1" width="216" height="148" rx="18"/>
  <rect x="1" y="1" width="216" height="148" rx="18" fill="none" stroke="url(#bd)" stroke-width="2"/>
  <text class="n" x="109" y="86" text-anchor="middle" fill="url(#g)" filter="url(#glow)"><animate attributeName="opacity" values="1;0.8;1" dur="3.0s" repeatCount="indefinite"/>20+</text>
  <text class="l" x="109" y="112" text-anchor="middle">años en producción del CTO</text>
</g><g transform="translate(240 0)">
  <rect class="pan" x="1" y="1" width="216" height="148" rx="18"/>
  <rect x="1" y="1" width="216" height="148" rx="18" fill="none" stroke="url(#bd)" stroke-width="2"/>
  <text class="n" x="109" y="86" text-anchor="middle" fill="url(#g)" filter="url(#glow)"><animate attributeName="opacity" values="1;0.8;1" dur="3.4s" repeatCount="indefinite"/>4</text>
  <text class="l" x="109" y="112" text-anchor="middle">nubes: AWS · Azure · GCP ·</text><text class="l" x="109" y="130" text-anchor="middle">OCI</text>
</g><g transform="translate(480 0)">
  <rect class="pan" x="1" y="1" width="216" height="148" rx="18"/>
  <rect x="1" y="1" width="216" height="148" rx="18" fill="none" stroke="url(#bd)" stroke-width="2"/>
  <text class="n" x="109" y="86" text-anchor="middle" fill="url(#g)" filter="url(#glow)"><animate attributeName="opacity" values="1;0.8;1" dur="3.8s" repeatCount="indefinite"/>0</text>
  <text class="l" x="109" y="112" text-anchor="middle">cambios en producción sin</text><text class="l" x="109" y="130" text-anchor="middle">tu OK</text>
</g><g transform="translate(720 0)">
  <rect class="pan" x="1" y="1" width="216" height="148" rx="18"/>
  <rect x="1" y="1" width="216" height="148" rx="18" fill="none" stroke="url(#bd)" stroke-width="2"/>
  <text class="n" x="109" y="86" text-anchor="middle" fill="url(#g)" filter="url(#glow)"><animate attributeName="opacity" values="1;0.8;1" dur="4.2s" repeatCount="indefinite"/>100%</text>
  <text class="l" x="109" y="112" text-anchor="middle">en tus cuentas y</text><text class="l" x="109" y="130" text-anchor="middle">repositorios</text>
</g>
</svg>
