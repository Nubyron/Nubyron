<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 202" role="img" aria-label="Partners: Microsoft Partner, Sarenet, KubeBolt design partner."><style>text{font-family:'Poppins','Segoe UI',Helvetica,Arial,sans-serif;}</style><defs>
