<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 490" role="img" aria-label="Cómo trabajamos: solo lectura, diagnóstico, tu autorización por escrito, cambio pequeño, documentado y traspaso."><style>text{font-family:'Poppins','Segoe UI',Helvetica,Arial,sans-serif;}.a{fill:#F2F5F7;font-size:17px;font-weight:700;} .b{fill:#9AA3AE;font-size:13.5px;}</style><defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#22E9F2"/><stop offset="1" stop-color="#4E29D6"/></linearGradient>
    <linearGradient id="g2" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#22E9F2"/><stop offset="1" stop-color="#4E29D6"/></linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <linearGradient id="bd" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="480" y2="0" spreadMethod="reflect"><stop offset="0" stop-color="#22E9F2"/><stop offset="0.5" stop-color="#4E29D6"/><stop offset="1" stop-color="#22E9F2"/><animateTransform attributeName="gradientTransform" type="translate" from="-480 0" to="480 0" dur="7s" repeatCount="indefinite"/></linearGradient>
</defs><rect x="1" y="1" width="478" height="488" rx="20" fill="#10121A" stroke="#262B3A" stroke-width="2"/><path id="rv" d="M52 58 V438" stroke="#262B3A" stroke-width="4"/><path d="M52 58 V438" stroke="url(#g)" stroke-width="4" stroke-dasharray="10 12"><animate attributeName="stroke-dashoffset" values="0;-44" dur="1.6s" repeatCount="indefinite"/></path><g><circle cx="52" cy="58" r="34" fill="#22E9F2" opacity="0.10"><animate attributeName="r" values="28;38;28" dur="3s" begin="0.0s" repeatCount="indefinite"/></circle><circle cx="52" cy="58" r="24" fill="#10121A" stroke="#22E9F2" stroke-width="3" filter="url(#glow)"/><text x="52" y="64" text-anchor="middle" fill="#22E9F2" font-weight="800" font-size="17">1</text><text class="a" x="100" y="56">Solo lectura</text><text class="b" x="100" y="78">empezamos sin tocar</text></g><g><circle cx="52" cy="134" r="34" fill="#22E9F2" opacity="0.10"><animate attributeName="r" values="28;38;28" dur="3s" begin="0.45s" repeatCount="indefinite"/></circle><circle cx="52" cy="134" r="24" fill="#10121A" stroke="#22E9F2" stroke-width="3" filter="url(#glow)"/><text x="52" y="140" text-anchor="middle" fill="#22E9F2" font-weight="800" font-size="17">2</text><text class="a" x="100" y="132">Diagnóstico</text><text class="b" x="100" y="154">qué hay y qué riesgo tiene</text></g><g><circle cx="52" cy="210" r="34" fill="#FFB020" opacity="0.10"><animate attributeName="r" values="28;38;28" dur="3s" begin="0.9s" repeatCount="indefinite"/></circle><circle cx="52" cy="210" r="24" fill="#10121A" stroke="#FFB020" stroke-width="3" filter="url(#glow)"/><text x="52" y="216" text-anchor="middle" fill="#FFB020" font-weight="800" font-size="13">OK</text><text class="a" x="100" y="208">Tu autorización</text><text class="b" x="100" y="230">por escrito, siempre</text></g><g><circle cx="52" cy="286" r="34" fill="#22E9F2" opacity="0.10"><animate attributeName="r" values="28;38;28" dur="3s" begin="1.35s" repeatCount="indefinite"/></circle><circle cx="52" cy="286" r="24" fill="#10121A" stroke="#22E9F2" stroke-width="3" filter="url(#glow)"/><text x="52" y="292" text-anchor="middle" fill="#22E9F2" font-weight="800" font-size="17">4</text><text class="a" x="100" y="284">Cambio pequeño</text><text class="b" x="100" y="306">con plan de retroceso</text></g><g><circle cx="52" cy="362" r="34" fill="#22E9F2" opacity="0.10"><animate attributeName="r" values="28;38;28" dur="3s" begin="1.8s" repeatCount="indefinite"/></circle><circle cx="52" cy="362" r="24" fill="#10121A" stroke="#22E9F2" stroke-width="3" filter="url(#glow)"/><text x="52" y="368" text-anchor="middle" fill="#22E9F2" font-weight="800" font-size="17">5</text><text class="a" x="100" y="360">Documentado</text><text class="b" x="100" y="382">decisión a decisión</text></g><g><circle cx="52" cy="438" r="34" fill="#22E9F2" opacity="0.10"><animate attributeName="r" values="28;38;28" dur="3s" begin="2.25s" repeatCount="indefinite"/></circle><circle cx="52" cy="438" r="24" fill="#10121A" stroke="#22E9F2" stroke-width="3" filter="url(#glow)"/><text x="52" y="444" text-anchor="middle" fill="#22E9F2" font-weight="800" font-size="17">6</text><text class="a" x="100" y="436">Traspaso</text><text class="b" x="100" y="458">para poder irnos</text></g><circle r="9" fill="url(#g2)" filter="url(#glow)"><animateMotion dur="8s" repeatCount="indefinite"><mpath href="#rv"/></animateMotion></circle></svg>
