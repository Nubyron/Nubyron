<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 1224" role="img" aria-label="Servicios: revisión de infraestructura Cloud, arquitectura Cloud, optimización de costes, seguridad Cloud, consultoría, migración, soporte y gestión Cloud, Kubernetes contenedores y DevOps, y asesoría técnica sin permanencia."><style>text{font-family:'Poppins','Segoe UI',Helvetica,Arial,sans-serif;}.c{fill:#10121A;} .ti{fill:#F2F5F7;font-size:17px;font-weight:700;} .de{fill:#B4BBC6;font-size:14px;} .tag{fill:#07080C;font-size:9.5px;font-weight:800;letter-spacing:1.6px;}</style><defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#22E9F2"/><stop offset="1" stop-color="#4E29D6"/></linearGradient>
    <linearGradient id="g2" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#22E9F2"/><stop offset="1" stop-color="#4E29D6"/></linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <linearGradient id="bd" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="480" y2="0" spreadMethod="reflect"><stop offset="0" stop-color="#22E9F2"/><stop offset="0.5" stop-color="#4E29D6"/><stop offset="1" stop-color="#22E9F2"/><animateTransform attributeName="gradientTransform" type="translate" from="-480 0" to="480 0" dur="7s" repeatCount="indefinite"/></linearGradient>
</defs><g transform="translate(0 0)"><rect class="c" x="1" y="1" width="478" height="126" rx="16"/><rect x="1" y="1" width="478" height="126" rx="16" fill="none" stroke="url(#bd)" stroke-width="2.4" opacity="1"/><rect x="20" y="16" width="136" height="22" rx="11" fill="url(#g)"><animate attributeName="opacity" values="1;0.65;1" dur="2.4s" repeatCount="indefinite"/></rect><text class="tag" x="88" y="31" text-anchor="middle">POR DÓNDE EMPEZAR</text><text class="ti" x="22" y="66">Revisión de tu infraestructura Cloud</text><text class="de" x="22" y="90">Descubre riesgos, gasto innecesario y mejoras antes</text><text class="de" x="22" y="110">de que te cuesten dinero.</text></g><g transform="translate(0 142)"><rect class="c" x="1" y="1" width="478" height="104" rx="16"/><rect x="1" y="1" width="478" height="104" rx="16" fill="none" stroke="url(#bd)" stroke-width="1.6" opacity="0.75"/><text class="ti" x="22" y="34">Arquitectura Cloud</text><text class="de" x="22" y="58">Infraestructura segura y estable, para crecer con tu</text><text class="de" x="22" y="78">producto sin rehacerla cada año.</text></g><g transform="translate(0 262)"><rect class="c" x="1" y="1" width="478" height="126" rx="16"/><rect x="1" y="1" width="478" height="126" rx="16" fill="none" stroke="url(#bd)" stroke-width="2.4" opacity="1"/><rect x="20" y="16" width="136" height="22" rx="11" fill="url(#g)"><animate attributeName="opacity" values="1;0.65;1" dur="2.4s" repeatCount="indefinite"/></rect><text class="tag" x="88" y="31" text-anchor="middle">POR DÓNDE EMPEZAR</text><text class="ti" x="22" y="66">Optimización de costes Cloud</text><text class="de" x="22" y="90">Entiende en qué gastas y reduce lo innecesario</text><text class="de" x="22" y="110">priorizando por riesgo.</text></g><g transform="translate(0 404)"><rect class="c" x="1" y="1" width="478" height="104" rx="16"/><rect x="1" y="1" width="478" height="104" rx="16" fill="none" stroke="url(#bd)" stroke-width="1.6" opacity="0.75"/><text class="ti" x="22" y="34">Seguridad Cloud</text><text class="de" x="22" y="58">Accesos, datos y configuraciones mejor protegidos,</text><text class="de" x="22" y="78">con prioridades claras.</text></g><g transform="translate(0 524)"><rect class="c" x="1" y="1" width="478" height="104" rx="16"/><rect x="1" y="1" width="478" height="104" rx="16" fill="none" stroke="url(#bd)" stroke-width="1.6" opacity="0.75"/><text class="ti" x="22" y="34">Consultoría y asesoramiento Cloud</text><text class="de" x="22" y="58">Decisiones Cloud con criterio: qué necesitas, qué no</text><text class="de" x="22" y="78">y cómo sacarle partido.</text></g><g transform="translate(0 644)"><rect class="c" x="1" y="1" width="478" height="104" rx="16"/><rect x="1" y="1" width="478" height="104" rx="16" fill="none" stroke="url(#bd)" stroke-width="1.6" opacity="0.75"/><text class="ti" x="22" y="34">Migración a la nube</text><text class="de" x="22" y="58">Mueve aplicaciones a la nube o entre proveedores con</text><text class="de" x="22" y="78">un plan y los riesgos gestionados.</text></g><g transform="translate(0 764)"><rect class="c" x="1" y="1" width="478" height="104" rx="16"/><rect x="1" y="1" width="478" height="104" rx="16" fill="none" stroke="url(#bd)" stroke-width="1.6" opacity="0.75"/><text class="ti" x="22" y="34">Soporte y gestión Cloud</text><text class="de" x="22" y="58">Resolvemos incidencias y mantenemos tu Cloud en el</text><text class="de" x="22" y="78">horario acordado.</text></g><g transform="translate(0 884)"><rect class="c" x="1" y="1" width="478" height="126" rx="16"/><rect x="1" y="1" width="478" height="126" rx="16" fill="none" stroke="url(#bd)" stroke-width="2.4" opacity="1"/><rect x="20" y="16" width="136" height="22" rx="11" fill="url(#g)"><animate attributeName="opacity" values="1;0.65;1" dur="2.4s" repeatCount="indefinite"/></rect><text class="tag" x="88" y="31" text-anchor="middle">POR DÓNDE EMPEZAR</text><text class="ti" x="22" y="66">Kubernetes, contenedores y DevOps</text><text class="de" x="22" y="90">Despliegues automáticos y plataformas de</text><text class="de" x="22" y="110">contenedores más fiables para tu equipo.</text></g><g transform="translate(0 1026)"><rect class="c" x="1" y="1" width="478" height="196" rx="18"/><rect x="1" y="1" width="478" height="196" rx="18" fill="none" stroke="url(#bd)" stroke-width="2.4"/><text class="de" x="24" y="40">O, si solo necesitas una segunda opinión senior:</text><text x="24" y="82" font-size="30" font-weight="800" fill="url(#g)" filter="url(#glow)">Asesoría técnica</text><text class="de" x="24" y="110">Desde una sola sesión hasta un acompañamiento</text><text class="de" x="24" y="130">continuo. Sin permanencia.</text><g transform="translate(24 146)" filter="url(#glow)"><rect width="230" height="40" rx="20" fill="url(#g)"><animate attributeName="opacity" values="1;0.8;1" dur="2.6s" repeatCount="indefinite"/></rect><text x="115" y="26" text-anchor="middle" font-size="14" font-weight="800" fill="#07080C">Reserva 30 minutos →</text></g></g></svg>
