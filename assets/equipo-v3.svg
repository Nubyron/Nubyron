<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 278" role="img" aria-label="Equipo de Nubyron: David González, CEO, arquitectura cloud, gestión de sistemas, gobierno de TI y ENS. Leafar Maina, CTO, más de 20 años en producción con Kubernetes, nubes e infraestructura crítica.">
  <style>
    text { font-family: 'Poppins','Segoe UI',Helvetica,Arial,sans-serif; }
    .card { fill: #10121A; }
    .name { fill: #fff; font-size: 26px; font-weight: 800; }
    .role { fill: #22E9F2; font-family: 'JetBrains Mono','Cascadia Mono',Consolas,'Courier New',monospace; font-size: 13px; font-weight: 700; letter-spacing: 3px; }
    .pill { fill: rgba(34,233,242,0.10); stroke: #22E9F2; stroke-width: 1.2; }
    .desc { fill: #CBD0D6; font-size: 13px; }
    .foot { fill: #9AA3AE; font-family: 'JetBrains Mono','Cascadia Mono',Consolas,'Courier New',monospace; font-size: 12px; }
    .ini { fill: #07080C; font-size: 36px; font-weight: 800; }
    .chip { fill: rgba(255,255,255,0.05); stroke: #343B52; stroke-width: 1; }
    .ct { fill: #E8EBEF; font-size: 11px; font-weight: 600; }
    .cur { fill: #22E9F2; animation: blink 1s steps(1) infinite; }
    @keyframes blink { 50% { opacity: 0; } }
  </style>
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#22E9F2"/><stop offset="1" stop-color="#4E29D6"/></linearGradient>
    <linearGradient id="g2" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#22E9F2"/><stop offset="1" stop-color="#4E29D6"/></linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="3.2" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <filter id="glow2" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="7" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>

    <linearGradient id="bord0" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="450" y2="0" spreadMethod="reflect"><stop offset="0" stop-color="#22E9F2"/><stop offset="0.5" stop-color="#4E29D6"/><stop offset="1" stop-color="#22E9F2"/><animateTransform attributeName="gradientTransform" type="translate" from="-450 0" to="450 0" dur="5s" repeatCount="indefinite"/></linearGradient>
    <linearGradient id="bord1" gradientUnits="userSpaceOnUse" x1="490" y1="0" x2="940" y2="0" spreadMethod="reflect"><stop offset="0" stop-color="#4E29D6"/><stop offset="0.5" stop-color="#22E9F2"/><stop offset="1" stop-color="#4E29D6"/><animateTransform attributeName="gradientTransform" type="translate" from="450 0" to="-450 0" dur="5s" repeatCount="indefinite"/></linearGradient>
    <linearGradient id="sweep" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#22E9F2" stop-opacity="0"/><stop offset="0.5" stop-color="#22E9F2" stop-opacity="0.12"/><stop offset="1" stop-color="#22E9F2" stop-opacity="0"/></linearGradient>
    <pattern id="dots" width="16" height="16" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1" fill="#fff" opacity="0.14"/></pattern>
    <linearGradient id="fadeG" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset="1" stop-color="#fff"/></linearGradient>
    <mask id="fadeR"><rect width="940" height="278" fill="url(#fadeG)"/></mask>
    <clipPath id="clip0"><rect x="1" y="1" width="448" height="274" rx="22"/></clipPath>
    <clipPath id="clip1"><rect x="491" y="1" width="448" height="274" rx="22"/></clipPath>
  </defs>
  <g><rect class="card" x="1" y="1" width="448" height="274" rx="22"/>
<rect x="1" y="1" width="448" height="274" rx="22" fill="url(#dots)" mask="url(#fadeR)"/>
<g clip-path="url(#clip0)"><rect x="-160" y="0" width="140" height="276" fill="url(#sweep)" transform="skewX(-18)"><animate attributeName="x" values="-220;540" dur="6s" repeatCount="indefinite"/></rect></g>
<rect x="1" y="1" width="448" height="274" rx="22" fill="none" stroke="url(#bord0)" stroke-width="3"/>
<circle cx="96" cy="112" r="64" fill="#22E9F2" opacity="0.12"><animate attributeName="r" values="58;74;58" dur="3.6s" repeatCount="indefinite"/><animate attributeName="opacity" values="0.2;0.04;0.2" dur="3.6s" repeatCount="indefinite"/></circle>
<circle cx="96" cy="112" r="56" fill="none" stroke="url(#g2)" stroke-width="3.5" stroke-dasharray="14 9" filter="url(#glow)"><animateTransform attributeName="transform" type="rotate" from="0 96 112" to="360 96 112" dur="20s" repeatCount="indefinite"/></circle>
<circle cx="96" cy="112" r="49" fill="none" stroke="#22E9F2" opacity="0.7" stroke-width="1.5" stroke-dasharray="2 7" stroke-linecap="round"><animateTransform attributeName="transform" type="rotate" from="360 96 112" to="0 96 112" dur="28s" repeatCount="indefinite"/></circle>
<circle r="4.8" fill="#22E9F2" filter="url(#glow)"><animateMotion dur="8s" repeatCount="indefinite" path="M 40 112 a 56 56 0 1 1 112 0 a 56 56 0 1 1 -112 0"/></circle>
<circle cx="96" cy="112" r="41" fill="url(#g2)"/>
<text class="ini" x="96" y="124" text-anchor="middle">DG</text>
<g transform="translate(170 38)"><rect class="pill" x="0.5" y="0.5" width="62" height="26" rx="13"/><text class="role" x="31" y="18" text-anchor="middle">CEO</text></g>
<text class="name" x="170" y="92">David González</text>
<text class="desc" x="170" y="120">Arquitectura cloud y</text>
<text class="desc" x="170" y="140">gestión de sistemas.</text>
<text class="desc" x="170" y="160">Gobierno de TI y ENS.</text>
<g transform="translate(170 188)"><rect class="chip" x="0.5" y="0.5" width="57" height="26" rx="13"/><circle cx="12" cy="13.5" r="3" fill="#22E9F2"><animate attributeName="opacity" values="1;0.3;1" dur="2.4s" begin="0.0s" repeatCount="indefinite"/></circle><text class="ct" x="21" y="18">Cloud</text></g><g transform="translate(236 188)"><rect class="chip" x="0.5" y="0.5" width="76" height="26" rx="13"/><circle cx="12" cy="13.5" r="3" fill="#8B6CFF"><animate attributeName="opacity" values="1;0.3;1" dur="2.4s" begin="0.4s" repeatCount="indefinite"/></circle><text class="ct" x="21" y="18">Sistemas</text></g><g transform="translate(321 188)"><rect class="chip" x="0.5" y="0.5" width="44" height="26" rx="13"/><circle cx="12" cy="13.5" r="3" fill="#22E9F2"><animate attributeName="opacity" values="1;0.3;1" dur="2.4s" begin="0.8s" repeatCount="indefinite"/></circle><text class="ct" x="21" y="18">ENS</text></g>
<line x1="28" y1="232" x2="422" y2="232" stroke="#262B3A" stroke-width="1.5"/>
<text class="foot" x="28" y="258"><tspan fill="#22E9F2">$</tspan> fundador · Las Palmas de GC<tspan class="cur">▌</tspan></text></g>
  <g><rect class="card" x="491" y="1" width="448" height="274" rx="22"/>
<rect x="491" y="1" width="448" height="274" rx="22" fill="url(#dots)" mask="url(#fadeR)"/>
<g clip-path="url(#clip1)"><rect x="330" y="0" width="140" height="276" fill="url(#sweep)" transform="skewX(-18)"><animate attributeName="x" values="270;1030" dur="6s" repeatCount="indefinite"/></rect></g>
<rect x="491" y="1" width="448" height="274" rx="22" fill="none" stroke="url(#bord1)" stroke-width="3"/>
<circle cx="586" cy="112" r="64" fill="#22E9F2" opacity="0.12"><animate attributeName="r" values="58;74;58" dur="3.6s" repeatCount="indefinite"/><animate attributeName="opacity" values="0.2;0.04;0.2" dur="3.6s" repeatCount="indefinite"/></circle>
<circle cx="586" cy="112" r="56" fill="none" stroke="url(#g2)" stroke-width="3.5" stroke-dasharray="14 9" filter="url(#glow)"><animateTransform attributeName="transform" type="rotate" from="360 586 112" to="0 586 112" dur="20s" repeatCount="indefinite"/></circle>
<circle cx="586" cy="112" r="49" fill="none" stroke="#22E9F2" opacity="0.7" stroke-width="1.5" stroke-dasharray="2 7" stroke-linecap="round"><animateTransform attributeName="transform" type="rotate" from="0 586 112" to="360 586 112" dur="28s" repeatCount="indefinite"/></circle>
<circle r="4.8" fill="#22E9F2" filter="url(#glow)"><animateMotion dur="8s" repeatCount="indefinite" path="M 530 112 a 56 56 0 1 1 112 0 a 56 56 0 1 1 -112 0"/></circle>
<circle cx="586" cy="112" r="41" fill="url(#g2)"/>
<text class="ini" x="586" y="124" text-anchor="middle">LM</text>
<g transform="translate(660 38)"><rect class="pill" x="0.5" y="0.5" width="62" height="26" rx="13"/><text class="role" x="31" y="18" text-anchor="middle">CTO</text></g>
<text class="name" x="660" y="92">Leafar Maina</text>
<text class="desc" x="660" y="120">Más de 20 años en producción</text>
<text class="desc" x="660" y="140">con Kubernetes, nubes e</text>
<text class="desc" x="660" y="160">infraestructura crítica.</text>
<g transform="translate(660 188)"><rect class="chip" x="0.5" y="0.5" width="89" height="26" rx="13"/><circle cx="12" cy="13.5" r="3" fill="#22E9F2"><animate attributeName="opacity" values="1;0.3;1" dur="2.4s" begin="0.0s" repeatCount="indefinite"/></circle><text class="ct" x="21" y="18">Kubernetes</text></g><g transform="translate(758 188)"><rect class="chip" x="0.5" y="0.5" width="57" height="26" rx="13"/><circle cx="12" cy="13.5" r="3" fill="#8B6CFF"><animate attributeName="opacity" values="1;0.3;1" dur="2.4s" begin="0.4s" repeatCount="indefinite"/></circle><text class="ct" x="21" y="18">Nubes</text></g><g transform="translate(824 188)"><rect class="chip" x="0.5" y="0.5" width="89" height="26" rx="13"/><circle cx="12" cy="13.5" r="3" fill="#22E9F2"><animate attributeName="opacity" values="1;0.3;1" dur="2.4s" begin="0.8s" repeatCount="indefinite"/></circle><text class="ct" x="21" y="18">Producción</text></g>
<line x1="518" y1="232" x2="912" y2="232" stroke="#262B3A" stroke-width="1.5"/>
<text class="foot" x="518" y="258"><tspan fill="#22E9F2">$</tspan> dirección técnica · Nubyron<tspan class="cur">▌</tspan></text></g>
</svg>
