<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 198" role="img" aria-label="Reserva 30 minutos con Nubyron, sin compromiso."><style>text{font-family:'Poppins','Segoe UI',Helvetica,Arial,sans-serif;}</style><defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#22E9F2"/><stop offset="1" stop-color="#4E29D6"/></linearGradient>
    <linearGradient id="g2" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#22E9F2"/><stop offset="1" stop-color="#4E29D6"/></linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <linearGradient id="bd" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="480" y2="0" spreadMethod="reflect"><stop offset="0" stop-color="#22E9F2"/><stop offset="0.5" stop-color="#4E29D6"/><stop offset="1" stop-color="#22E9F2"/><animateTransform attributeName="gradientTransform" type="translate" from="-480 0" to="480 0" dur="7s" repeatCount="indefinite"/></linearGradient>
</defs><rect x="1" y="1" width="478" height="196" rx="24" fill="#10121A"/><rect x="1" y="1" width="478" height="196" rx="24" fill="none" stroke="url(#bd)" stroke-width="3"/><text x="28" y="60" font-size="26" font-weight="800" fill="#F2F5F7">¿Hablamos?</text><text x="28" y="92" font-size="26" font-weight="800" fill="#F2F5F7">Sin compromiso.</text><text x="28" y="122" font-size="14" fill="#9AA3AE">Una primera llamada de 30 minutos</text><text x="28" y="142" font-size="14" fill="#9AA3AE">para entender tu caso.</text><g transform="translate(250 134)" filter="url(#glow)"><rect width="210" height="46" rx="23" fill="url(#g)"><animate attributeName="opacity" values="1;0.82;1" dur="2.4s" repeatCount="indefinite"/></rect><text x="105" y="29" text-anchor="middle" font-size="14.5" font-weight="800" fill="#07080C">Reserva 30 minutos →</text></g></svg>
