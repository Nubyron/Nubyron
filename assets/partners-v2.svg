<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 72" role="img" aria-label="Partners: Microsoft Partner, Sarenet, KubeBolt design partner.">
  <style>text { font-family: 'Poppins','Segoe UI',Helvetica,Arial,sans-serif; } .chip { fill: #10121A; } .ct { fill: #F2F5F7; font-size: 17px; font-weight: 700; }</style>
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#22E9F2"/><stop offset="1" stop-color="#4E29D6"/></linearGradient>
    <linearGradient id="g2" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#22E9F2"/><stop offset="1" stop-color="#4E29D6"/></linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="3.2" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <filter id="glow2" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="7" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>

    <linearGradient id="bd" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="940" y2="0" spreadMethod="reflect"><stop offset="0" stop-color="#22E9F2"/><stop offset="0.5" stop-color="#4E29D6"/><stop offset="1" stop-color="#22E9F2"/><animateTransform attributeName="gradientTransform" type="translate" from="-940 0" to="940 0" dur="8s" repeatCount="indefinite"/></linearGradient>
  </defs>
  <g transform="translate(115 8)"><rect class="chip" x="1" y="1" width="228" height="54" rx="27"/><rect x="1" y="1" width="228" height="54" rx="27" fill="none" stroke="url(#bd)" stroke-width="2"/><circle cx="30" cy="28" r="6" fill="#22E9F2" filter="url(#glow)"><animate attributeName="r" values="6;9;6" dur="2.4s" begin="0.0s" repeatCount="indefinite"/></circle><text class="ct" x="50" y="34">Microsoft Partner</text></g><g transform="translate(365 8)"><rect class="chip" x="1" y="1" width="128" height="54" rx="27"/><rect x="1" y="1" width="128" height="54" rx="27" fill="none" stroke="url(#bd)" stroke-width="2"/><circle cx="30" cy="28" r="6" fill="#8B6CFF" filter="url(#glow)"><animate attributeName="r" values="6;9;6" dur="2.4s" begin="0.5s" repeatCount="indefinite"/></circle><text class="ct" x="50" y="34">Sarenet</text></g><g transform="translate(515 8)"><rect class="chip" x="1" y="1" width="308" height="54" rx="27"/><rect x="1" y="1" width="308" height="54" rx="27" fill="none" stroke="url(#bd)" stroke-width="2"/><circle cx="30" cy="28" r="6" fill="#22E9F2" filter="url(#glow)"><animate attributeName="r" values="6;9;6" dur="2.4s" begin="1.0s" repeatCount="indefinite"/></circle><text class="ct" x="50" y="34">KubeBolt · Design Partner</text></g>
</svg>
